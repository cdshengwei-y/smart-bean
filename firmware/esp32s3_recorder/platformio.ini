[platformio]
default_envs = xiao_esp32s3_custom_board_release_038

; Legacy profile for the original XIAO Sense expansion board. Keep it explicit:
; the production default below targets the custom expansion board.
[env:xiao_esp32s3_sense]
platform = espressif32@6.5.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota_8MB.csv
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  knolleary/PubSubClient@^2.8
build_flags =
  -DCORE_DEBUG_LEVEL=3

[env:xiao_esp32s3_ota_test]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_FIRMWARE_VERSION=\"0.2.3\"
  -DRECORDER_TEST_RECORDING_LIMIT_SECONDS=5
  -DRECORDER_WIFI_DIAGNOSTICS=1

[env:xiao_esp32s3_bean_ye_1]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_DEVICE_ID=\"bean_ye_1\"

[env:xiao_esp32s3_bean_ye_1_ota_034]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_DEVICE_ID=\"bean_ye_1\"
  -DRECORDER_FIRMWARE_VERSION=\"0.3.4\"
  -DRECORDER_OTA_MANIFEST_URL=\"http://192.168.0.107:8790/manifest/bean_ye_1.json\"

[env:xiao_esp32s3_bean_ye_2_ota_034]
extends = env:xiao_esp32s3_sense
upload_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_FIRMWARE_VERSION=\"0.3.4\"
  -DRECORDER_OTA_MANIFEST_URL=\"http://192.168.0.107:8790/manifest/bean_ye_2.json\"

[env:xiao_esp32s3_bean_ye_1_ota_035]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_DEVICE_ID=\"bean_ye_1\"
  -DRECORDER_FIRMWARE_VERSION=\"0.3.5\"
  -DRECORDER_OTA_MANIFEST_URL=\"http://192.168.0.107:8790/manifest/bean_ye_1.json\"

[env:xiao_esp32s3_bean_ye_2_ota_035]
extends = env:xiao_esp32s3_sense
upload_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_FIRMWARE_VERSION=\"0.3.5\"
  -DRECORDER_OTA_MANIFEST_URL=\"http://192.168.0.107:8790/manifest/bean_ye_2.json\"

; Safe shared artifact for devices that still use the original /manifest.json
; endpoint. The firmware maps the two deployed hardware MACs back to their
; correct device IDs before it writes recordings or asks for later updates.
[env:xiao_esp32s3_shared_identity_recovery_037]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_DEVICE_ID=\"\"
  -DRECORDER_FIRMWARE_VERSION=\"0.3.7\"

; The hardware profile is independent of device identity. Known deployed XIAO
; MACs retain their names; an unknown XIAO gets its own eFuse-derived identity.
[env:xiao_esp32s3_custom_board_release_038]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  ; T3902 SELECT is tied to GND on the custom expansion board.
  -DRECORDER_MIC_RIGHT_CHANNEL=1
  -DRECORDER_FIRMWARE_VERSION=\"0.3.12\"

; Diagnostic release for checking GPIO hold release before PDM clock startup.
[env:xiao_esp32s3_custom_board_bean_ye_1_mic_wake_test]
extends = env:xiao_esp32s3_custom_board_release_038
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=1
  -DRECORDER_FIRMWARE_VERSION=\"0.3.12-wake-hold-fix\"

; Explicit bean_ye_2 identity requested for testing the existing Obsidian binding
; on the connected bean_ye_1 main board. Keep this out of shared release images.
[env:xiao_esp32s3_custom_board_bean_ye_2_binding_test]
extends = env:xiao_esp32s3_custom_board_release_038
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=1
  -DRECORDER_TEST_DEVICE_ID=\"bean_ye_2\"
  -DRECORDER_FIRMWARE_VERSION=\"0.3.12-bean-ye-2-binding-test\"

; Left-slot PDM probe. Identical to the bean_ye_2 binding test except that the
; PDM capture slot flips to the left edge. A mono PDM microphone drives only one
; clock edge; reading the undriven edge decodes to one constant sample value.
; Use this to decide whether the constant-WAV fault is a slot mismatch or a dead
; data path, without changing any other behavior.
[env:xiao_esp32s3_custom_board_bean_ye_2_left_slot_test]
extends = env:xiao_esp32s3_custom_board_bean_ye_2_binding_test
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=0
  -DRECORDER_TEST_DEVICE_ID=\"bean_ye_2\"
  -DRECORDER_FIRMWARE_VERSION=\"0.3.12-bean-ye-2-left-slot-test\"

; AgentOS direct MQTT integration test. The device connects to the RK3588
; broker directly; credentials belong in a private build configuration.
[env:xiao_esp32s3_custom_board_agent_hub_test]
extends = env:xiao_esp32s3_custom_board_release_038
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  ; Keep the known-good original new-board TF-card path for the hub integration.
  ; The original 0.3.7 image uses GPIO3 and the GPIO40-controlled TF rail.
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_SD_CS_PIN=3
  -DRECORDER_SD_STANDALONE_INIT=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=1
  -DRECORDER_MQTT_ENABLED=1
  -DRECORDER_MQTT_HOST=\"192.168.0.134\"
  -DRECORDER_MQTT_PORT=1883
  -DRECORDER_MQTT_USERNAME=\"bean_ye_1\"
  -DRECORDER_FIRMWARE_VERSION=\"0.3.12-agentos-mqtt-test\"

; Named alias for new deployments. Keep the older environment name above so
; existing flashing scripts do not silently select a different hardware image.
[env:xiao_esp32s3_custom_board_agentos_mqtt_test]
extends = env:xiao_esp32s3_custom_board_agent_hub_test

; Smart Hub integration test using the original recorder TF-card power path.
; Keep this separate from the custom-board power-switch image until the board
; level TF-card behavior is confirmed.
[env:xiao_esp32s3_custom_board_agent_hub_legacy_sd_test]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=1
  -DRECORDER_MQTT_ENABLED=1
  -DRECORDER_MQTT_HOST=\"192.168.0.134\"
  -DRECORDER_MQTT_PORT=1883
  -DRECORDER_FIRMWARE_VERSION=\"0.3.12-agent-hub-legacy-sd-test\"

; Hardware diagnosis image: keep the current MQTT path but use the original
; 0.3.7 mount reset sequence on the current custom-board CS pin.
[env:xiao_esp32s3_custom_board_agent_hub_legacy_sd_init_test]
extends = env:xiao_esp32s3_custom_board_agent_hub_legacy_sd_test
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=1
  -DRECORDER_MQTT_ENABLED=1
  -DRECORDER_MQTT_HOST=\"192.168.0.134\"
  -DRECORDER_MQTT_PORT=1883
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_SD_CS_PIN=3
  -DRECORDER_SD_BLE_BEFORE_INIT=1
  -DRECORDER_SD_LEGACY_INIT=1
  -DRECORDER_FIRMWARE_VERSION=\"0.3.12-agent-hub-legacy-sd-exact-test\"

; Test image: identical to the production idle/sleep decision path, but the
; idle delay is one minute so board-level validation is quicker. It is not
; forced sleep and must never replace the production release image.
[env:xiao_esp32s3_custom_board_sleep_test_1min_038]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=1
  -DRECORDER_FIRMWARE_VERSION=\"0.3.12-sleep-test-60s\"
  -DRECORDER_SLEEP_IDLE_MS=60000UL

; OTA acceptance baseline for bean_ye_1. This is deliberately the same current
; 60-second sleep-test hardware profile, with only the semantic version lowered
; so the 0.3.13 OTA acceptance image can be discovered and installed.
[env:xiao_esp32s3_custom_board_bean_ye_1_ota_baseline_0310]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=1
  -DRECORDER_FIRMWARE_VERSION=\"0.3.10-ota-baseline\"
  -DRECORDER_SLEEP_IDLE_MS=60000UL

; OTA acceptance image for bean_ye_1. It deliberately preserves the custom
; board wiring and one-minute idle-sleep behavior of the current test image.
; The numeric version must be higher than 0.3.12 for the device OTA checker.
[env:xiao_esp32s3_custom_board_bean_ye_1_ota_acceptance_0313]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=1
  ; Board rev. 20260929+: mic VDD gated by U2 (TPS22919), EN = MIC_PWR_EN on
  ; GPIO15 (expansion CN1 pad 10 <-> base J3 pad 11). Without this flag the
  ; production firmware never drives GPIO15 and the mic stays off forever.
  -DRECORDER_MIC_PWR_EN_GPIO=15
  ; New T3902 mic (2026-11-12) verified working; user reports slightly low
  ; volume. 4x keeps shouted peaks (~1.3k raw, worst case ~5k) far from clip.
  -DRECORDER_MIC_DIGITAL_GAIN=4
  -DRECORDER_FIRMWARE_VERSION=\"0.3.13-ota-acceptance\"
  -DRECORDER_SLEEP_IDLE_MS=60000UL

; OTA acceptance image only. This keeps the custom-board wiring contract but
; uses a higher version so the local LAN OTA flow can be exercised from 0.3.10.
; Never use this environment as the production release target.
[env:xiao_esp32s3_custom_board_ota_acceptance_0311]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=1
  -DRECORDER_FIRMWARE_VERSION=\"0.3.11\"
  -DRECORDER_OTA_MANIFEST_URL=\"http://192.168.0.107:8790/manifest.json\"

; Electrical diagnostic image. It runs the same full peripheral shutdown as
; production after 20 seconds, then remains asleep for 60 seconds.
[env:xiao_esp32s3_custom_board_force_sleep_test_038]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=1
  -DRECORDER_FIRMWARE_VERSION=\"0.3.10-force-sleep20s-full-wake60s\"
  -DRECORDER_SLEEP_IDLE_MS=20000UL
  -DRECORDER_FORCE_SLEEP_TEST=1
  -DRECORDER_DEEP_SLEEP_DIAGNOSTIC_WAKE_US=60000000ULL

[env:xiao_esp32s3_bean_ye_1_sleep_test]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_DEVICE_ID=\"bean_ye_1\"
  -DRECORDER_FIRMWARE_VERSION=\"0.3.0-sleep10s\"
  -DRECORDER_SLEEP_IDLE_MS=10000UL

[env:xiao_esp32s3_bean_ye_1_force_sleep_test]
extends = env:xiao_esp32s3_sense
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_DEVICE_ID=\"bean_ye_1\"
  -DRECORDER_FIRMWARE_VERSION=\"0.3.0-force-sleep10s\"
  -DRECORDER_SLEEP_IDLE_MS=10000UL
  -DRECORDER_FORCE_SLEEP_TEST=1

; Standalone diagnostic: drives each candidate MIC_PWR_EN GPIO high in turn
; and samples the PDM mic to find which pin actually powers U2 / the mic.
; Uses its own src dir so the recorder firmware is not compiled into it.
[env:xiao_esp32s3_custom_board_mic_pwr_sweep]
extends = env:xiao_esp32s3_sense
build.src_dir = src_mic_sweep
build_flags =
  -DCORE_DEBUG_LEVEL=3

; Mic power switch validation: board rev. 20260929+ feeds MIC_VDD through the
; U2 TPS22919 load switch whose EN (MIC_PWR_EN) sits on GPIO15 behind a 100k
; pull-down. Firmware must drive it high or the mic never powers up (root cause
; of the constant-sample recordings on bean_ye_1). Otherwise identical to the
; agentos_mqtt_test image.
[env:xiao_esp32s3_custom_board_bean_ye_1_mic_pwr_en]
extends = env:xiao_esp32s3_custom_board_release_038
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_SD_CS_PIN=3
  -DRECORDER_SD_STANDALONE_INIT=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=1
  -DRECORDER_MIC_PWR_EN_GPIO=15
  -DRECORDER_MQTT_ENABLED=1
  -DRECORDER_MQTT_HOST=\"192.168.0.134\"
  -DRECORDER_MQTT_PORT=1883
  -DRECORDER_MQTT_USERNAME=\"bean_ye_1\"
  -DRECORDER_FIRMWARE_VERSION=\"0.3.12-bean-ye-1-micpwr\"

; Left-slot variant of the acceptance image: mic power fix landed, now test
; whether the T3902 (SELECT=GND) actually drives the LEFT PDM slot -- August's
; good recordings were made by envs without RECORDER_MIC_RIGHT_CHANNEL (=LEFT).
[env:xiao_esp32s3_custom_board_bean_ye_1_ota_acceptance_0313_leftslot]
extends = env:xiao_esp32s3_custom_board_bean_ye_1_ota_acceptance_0313
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRECORDER_CUSTOM_EXPANSION_BOARD=1
  -DRECORDER_SD_POWER_SWITCH=1
  -DRECORDER_FORCE_EFUSE_DEVICE_ID=1
  -DRECORDER_MIC_RIGHT_CHANNEL=0
  -DRECORDER_MIC_PWR_EN_GPIO=15
  -DRECORDER_FIRMWARE_VERSION=\"0.3.13-ota-acceptance-leftslot\"
  -DRECORDER_SLEEP_IDLE_MS=60000UL

; 分段直播预览 + 边录边传（Stage B）。硬件 profile 与 0313 acceptance 一致；
; 固件内部分段每 60 秒一份、录音中即上传，backend 逐段转写流进 Obsidian。
[env:xiao_esp32s3_custom_board_bean_ye_1_live_segments]
extends = env:xiao_esp32s3_custom_board_bean_ye_1_ota_acceptance_0313
build_flags =
  ${env:xiao_esp32s3_custom_board_bean_ye_1_ota_acceptance_0313.build_flags}
  -DRECORDER_FIRMWARE_VERSION=\"0.3.14-live-segments\"

; bean_ye_2（当前唯一实体设备）的分段直播固件：binding-test 硬件 profile + 分段边录边传。
; 注意：该板为 rev.20260929+ 新硬件，必须带 MIC_PWR_EN_GPIO=15（否则麦克风无电无声）
; 与 T3902 的 4x 数字增益，以及既有的 60 秒闲置睡眠行为。
[env:xiao_esp32s3_custom_board_bean_ye_2_live_segments]
extends = env:xiao_esp32s3_custom_board_bean_ye_2_binding_test
board_build.flash_size = 8MB
build_flags =
  ${env:xiao_esp32s3_custom_board_bean_ye_2_binding_test.build_flags}
  -DRECORDER_MIC_PWR_EN_GPIO=15
  -DRECORDER_MIC_DIGITAL_GAIN=4
  ; 设备常接扩展座供电，60s/2min 闲置深睡导致蓝牙频繁"失踪"；
  ; 改 30 分钟：随手就能连，半小时不用才睡省电。
  -DRECORDER_SLEEP_IDLE_MS=1800000UL
  -DRECORDER_DISABLE_CLOUD_UPLOAD=1
  -DRECORDER_FIRMWARE_VERSION=\"0.3.15-live-segments\"
