; Standalone MIC_PWR_EN hold/diagnose firmware -- separate project on purpose
; (per-env src_dir override silently fails; separate dirs are the safe pattern).
[env:xiao_esp32s3_mic_hold]
platform = espressif32@6.5.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota_8MB.csv
build_flags =
  -DCORE_DEBUG_LEVEL=3
