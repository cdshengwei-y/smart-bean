; Standalone MIC_PWR_EN probe project -- intentionally separate from
; esp32s3_recorder so the sweep binary can never again be silently built from
; the recorder sources (the per-env src_dir override does not work reliably).
[env:xiao_esp32s3_mic_sweep]
platform = espressif32@6.5.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota_8MB.csv
build_flags =
  -DCORE_DEBUG_LEVEL=3
